[project]
name = "support-agent"
version = "0.1.0"
description = "电商客服纯对话与售后信息提取"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiomysql>=0.3,<0.4",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "jsonschema>=4.25,<5",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-deepseek>=1,<2",
    "langchain-mcp-adapters>=0.2,<0.3",
    "langchain-openai>=1,<2",
    "langfuse>=4.18,<5",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "mcp>=1.26,<2",
    "openai>=3.55,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pymilvus==2.6.18",
    "pymysql[rsa]>=1.2,<2",
    "python-multipart>=0.0.20,<0.1",
    "sqlalchemy>=2.0.55,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "playwright>=1.58,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.uv]
package = false
