<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="电商智能客服，咨询购物问题，沟通退换货与售后诉求。">
    <meta name="theme-color" content="#f5f7f9">
    <title>客服对话 · 电商智能客服</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231b6255'/%3E%3Cpath d='M9 10h14v10H15l-5 4v-4H9z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/chat.css">
    <script type="module" src="/static/chat.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#message">跳到消息输入框</a>
    <aside class="sidebar" aria-label="客服服务">
      <a class="brand" href="/" aria-label="电商智能客服首页"><span class="brand-mark" aria-hidden="true">聊</span><span>电商智能客服<small>购物与售后，随时聊聊</small></span></a>
      <button id="new-conversation" class="new-conversation" type="button"><span aria-hidden="true">＋</span> 新建对话</button>
      <div class="sidebar-label">当前对话</div>
      <div class="current-conversation"><span class="chat-symbol" aria-hidden="true">◻</span><span id="conversation-title">购物与售后咨询</span></div>
      <div class="sidebar-note"><span class="note-symbol" aria-hidden="true">?</span><strong>从问题开始就好</strong><p>描述遇到的情况，也可以附上订单号和希望的处理方式。</p></div>
      <div class="sidebar-footer">电商智能客服<span>客服对话</span></div>
    </aside>

    <main class="workspace">
      <header class="topbar"><div><span class="eyebrow">服务中心</span><h1>客服对话</h1></div><span class="session-label" id="session-label">新对话</span></header>
      <div class="conversation-scroll" id="conversation-scroll">
        <div class="conversation-content">
          <section class="welcome" id="welcome" aria-labelledby="welcome-title">
            <div class="welcome-mark" aria-hidden="true">聊<span>✦</span></div>
            <p class="eyebrow">购物有疑问，售后有诉求</p>
            <h2 id="welcome-title">您好，有什么可以帮您？</h2>
            <p class="welcome-description">把问题告诉我，我们一起梳理。<br>您可以接着追问，无需重复前面的内容。</p>
            <div class="suggestions" aria-label="选择一个问题开始">
              <button type="button" data-prompt="我想了解一下退换货需要提供哪些信息。"><span aria-hidden="true">↺</span><strong>咨询退换货</strong><span>需要准备哪些信息？</span></button>
              <button type="button" data-prompt="收到的商品有破损，我应该怎么处理？"><span aria-hidden="true">▣</span><strong>商品有问题</strong><span>收到的商品有破损</span></button>
              <button type="button" data-prompt="我想咨询订单问题，需要提供什么信息？"><span aria-hidden="true">≡</span><strong>咨询订单问题</strong><span>从订单情况开始聊</span></button>
            </div>
          </section>
          <section id="messages" class="messages" role="log" aria-label="对话消息" aria-live="polite" aria-relevant="additions" tabindex="0"></section>
        </div>
      </div>
      <div class="composer-area">
        <div class="notice" id="notice" role="alert" hidden><span id="notice-text"></span><button id="retry" type="button">重试本轮</button></div>
        <div class="composer-status" id="status" role="status" aria-live="polite">说说您遇到的问题吧</div>
        <form id="chat-form" class="composer" action="/chat" method="post">
          <label class="visually-hidden" for="message">输入您的问题</label>
          <textarea id="message" name="message" rows="2" maxlength="16384" placeholder="输入您的问题，也可以补充订单号…" required></textarea>
          <div class="composer-bottom"><span id="input-hint">Enter 发送 · Shift + Enter 换行</span><button class="send-button" id="send" type="submit" disabled>发送消息 <span aria-hidden="true">↗</span></button></div>
        </form>
        <p class="disclaimer">回复仅供沟通参考，具体售后方案以商家确认为准。</p>
      </div>
    </main>
    <noscript>请启用 JavaScript 以使用客服聊天页面。</noscript>
  </body>
</html>
