<!doctype html>
<html lang="zh-CN" data-type="software">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="对照用户原话和召回证据审核知识缺口，查看客服用量和质量趋势。">
    <meta name="page-type" content="software">
    <meta name="site-kind" content="software">
    <title>知识改进 · 电商智能客服</title>
    <link rel="stylesheet" href="/static/evaluation.css">
    <link rel="stylesheet" href="/static/review.css">
    <script type="module" src="/static/review.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#review-list">跳到待审问题</a>
    <header class="nav"><a class="brand" href="/"><span aria-hidden="true">审</span>电商智能客服 <small>知识改进</small></a><nav class="heading-actions" aria-label="后台导航"><a class="back" href="/evaluations">RAG 评估 ↗</a><a class="back" href="/">返回聊天 ↗</a></nav></header>
    <main>
      <div class="page-heading"><div><p class="eyebrow">从未解决的问题补齐知识</p><h1>知识改进</h1><p class="intro">先对照当时的召回片段，再决定补充答案或改进检索。</p></div><button id="refresh" class="secondary" type="button">刷新数据</button></div>
      <p id="review-status" class="notice" role="status" aria-live="polite">正在读取问题队列…</p>
      <section class="panel" aria-labelledby="queue-title">
        <div class="section-heading"><div><h2 id="queue-title">待审队列</h2><p id="queue-count">每个问题汇总相同含义的用户提问。</p></div><button id="process-pool" class="primary" type="button">处理新问题</button></div>
        <div class="filters"><label>审核状态<select id="review-filter"><option value="pending">待审核</option><option value="publishing">入库待重试</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="">全部状态</option></select></label></div>
        <div id="review-list" aria-live="polite"></div>
      </section>
      <section class="panel" aria-labelledby="cost-title"><div class="section-heading"><div><h2 id="cost-title">Token 花在哪类问题上</h2><p>按整轮请求的最终意图归集，包括问题理解、分类和生成；缺失用量单独标记。</p></div></div><div id="cost-list"></div></section>
      <section class="panel" aria-labelledby="trend-title"><div class="section-heading"><div><h2 id="trend-title">评估指标趋势</h2><p>固定展示混合检索与精排策略，按时间比较 Recall@5、MRR 和 Faithfulness。</p></div></div><div id="trend-chart"></div><div id="run-list" class="table-scroll" tabindex="0" role="region" aria-label="历史评估结果，可左右滚动"></div></section>
    </main>
  </body>
</html>
